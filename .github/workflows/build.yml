name: build

on:
  push:
  pull_request:

jobs:
  # OpenDock.Core is a plain net8.0 library with no Windows dependencies,
  # so it must stay compilable on any platform.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/OpenDock.Core/OpenDock.Core.csproj -c Release

  # The WPF app needs Windows (XAML compilation + Win32 SDK targeting pack).
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/OpenDock.sln -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDock-windows
          path: src/OpenDock/bin/Release/net8.0-windows/
